# =============================================================================
# 고객사 설정 (템플릿)
# =============================================================================
# 이 파일을 config/customers.yml 로 복사한 뒤 실제 고객사 정보로 채우세요.
# config/customers.yml 은 .gitignore 에 등록되어 있어 실수로 커밋/공개되지 않습니다.
#
#   cp config/customers.example.yml config/customers.yml   (또는 그냥 복사)
#
# organize_mail, search_mail 도구가 참조하는 고객사 목록입니다.
# 메일 제목 / 본문 / 참조(CC) 안에 아래 별칭(aliases) 중 하나라도 포함되어 있으면
# 해당 고객사로 분류됩니다. (발신자 이메일 도메인은 보지 않습니다 - 내부 직원이
# 대신 보낸 메일이라도 본문에 고객사 이름이 있으면 그 고객사로 분류됩니다.)
#
# - name     : 받은 편지함 > 고객사 > {name} 폴더 이름으로 그대로 사용됩니다.
#              해당 폴더가 없으면 자동으로 생성됩니다.
# - aliases  : 검색에 사용할 별칭 목록입니다. 대소문자는 구분하지 않습니다.
#              name 자신도 검색되길 원한다면 aliases 목록에도 포함하세요.
#              정식 명칭과 흔히 쓰는 약칭(영문 이니셜 등)을 함께 넣으면 인식률이 올라갑니다.
#
# 목록은 위에서부터 순서대로 검사하며, 가장 먼저 일치하는 고객사로 분류됩니다.
# 새 고객사를 추가하려면 이 파일에 항목만 추가하면 됩니다 (코드 수정 불필요).
# =============================================================================

# 예시로는 아무 뜻 없는 동물 코드명을 사용했습니다. 실제 사용 시 진짜 고객사 이름으로 바꾸세요.
customers:
  - name: 판다
    aliases:
      - 판다
      - PANDA

  - name: 수달
    aliases:
      - 수달
      - OTTER

  - name: 여우
    aliases:
      - 여우
      - FOX
