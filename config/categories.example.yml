# =============================================================================
# 메일 카테고리 설정 (템플릿)
# =============================================================================
# 이 파일을 config/categories.yml 로 복사한 뒤 실제 조직에 맞게 채우세요.
# config/categories.yml 은 .gitignore 에 등록되어 있어 실수로 커밋/공개되지 않습니다.
#
#   cp config/categories.example.yml config/categories.yml   (또는 그냥 복사)
#
# customers.yml 에서 고객사로 분류되지 않은 메일에 대해 적용되는 규칙입니다.
# 목록 순서대로 검사하며, 가장 먼저 일치하는 카테고리로 분류됩니다.
#
# 이 예시의 폴더 구성:
#   1. 참고자료 - 2. 고객사(customer_root_folder) - 3. 사내공지 - 4. 뉴스레터 -
#   5. 업무논의 - 6. 일정알림(calendar_folder) - 7. 기타(default_folder)
#
# - name            : 카테고리 이름 (결과 보고에 표시됩니다)
# - folder          : 받은 편지함 하위 폴더 경로. "/" 로 하위 폴더를 구분합니다.
#                      (예: "참고자료/2026" 처럼 다단계 폴더도 가능.
#                       주의: Outlook 폴더 이름 자체에 "/" 가 들어가면 경로 해석이 꼬입니다.)
#                      이미 Outlook 에 만들어둔 폴더가 있다면 그 폴더명을 그대로 적으면
#                      (번호 접두사 포함) 새 폴더를 만들지 않고 기존 폴더로 이동합니다.
# - keywords        : 제목 또는 본문에 포함되면 일치로 간주합니다. (대소문자 무관)
# - sender_domains  : 발신자 이메일 도메인이 일치하면 일치로 간주합니다.
#                      (예: "company.co.kr". "@" 는 생략해도 됩니다)
#
# 주의: 한 카테고리에 keywords 와 sender_domains 를 동시에 지정하면 "키워드 일치 OR
# 도메인 일치" 로 판정됩니다 (AND 아님). 발신자 도메인이 넓은 범위를 포괄한다면
# (예: 그룹웨어/HR 시스템 도메인) 다른 규칙보다 뒤쪽에 두는 것이 안전합니다.
#
# 카테고리를 추가/삭제하려면 이 파일만 수정하면 됩니다 (코드 수정 불필요).
# =============================================================================

categories:
  - name: 참고자료
    folder: "1. 참고자료"
    keywords:
      - 참고자료
      - 공유드립니다
      - FYI
    sender_domains: []

  - name: 사내공지
    folder: "3. 사내공지"
    keywords:
      - "[공지]"
      - "[안내]"
      - 전사공지
      - 인사발령
    sender_domains: []

  - name: 뉴스레터
    folder: "4. 뉴스레터"
    keywords:
      - newsletter
      - 뉴스레터
      - bulletin
      - digest
      - 구독취소
      - unsubscribe
    sender_domains: []

  # 사내 동료들과 주고받는 업무 논의/회의 메일. 아래 키워드는 예시일 뿐이니
  # 실제 조직에서 쓰는 표현으로 바꾸세요.
  - name: 업무논의
    folder: "5. 업무논의"
    keywords:
      - 회의
      - 미팅
      - 협의
      - 논의
    sender_domains: []

# 위 규칙 중 어느 것에도 해당하지 않는 메일이 이동할 기본 폴더
default_folder: "7. 기타"

# 고객사로 분류된 메일이 모이는 상위 폴더 이름
# 실제 이동 경로는 "{customer_root_folder}/{customers.yml 의 name}" 이 됩니다.
customer_root_folder: "2. 고객사"

# 회의 요청/응답, 연차 등 캘린더성 항목(일반 메일이 아닌 항목)이 이동할 폴더.
# 이 항목들은 위 categories/customers 판별 없이 항상 이 폴더로 이동합니다.
calendar_folder: "6. 일정알림"
